interface:
  display_name: 삼삼엠투 소비자원 답변서
  short_description: 소보원·1372 민원을 SpaceV Google Docs 양식으로 바로 작성
  default_prompt: 공문, 결제 상세 정보, 계약메모 전체를 검토해 내부 CS 용어와 불필요한 금액 세부·미확인 상태를 제거하고, SpaceV 로고가 있는 기준 Google Docs를 네이티브 복사해 답변서를 작성해줘. Word/DOCX/PDF는 만들지 말고 최종 Google Docs 링크만 반환해줘.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  allow_implicit_invocation: true
