interface:
  display_name: 삼삼엠투 소비자원 답변서
  short_description: 소보원·1372 민원을 SpaceV 고정 Google Docs 양식으로 바로 작성
  default_prompt: >-
    공문, 결제 상세 정보, 계약메모 전체를 검토해 소비자원 답변서를 작성해줘. 영구 마스터 Google Doc `[답변서] 고정 양식` 문서 ID 1slSv_nu58ITcUz07pm-O1EVcSf1n7v7_viQ93cqaxHo를 Drive 검색 없이 직접 열고 네이티브 복사한 뒤 사본의 빈 필드와 2·3항 본문만 현재 사건 값으로 채워. 원본은 절대 수정하지 마. 빈 Google Doc을 새로 만들거나 양식을 재현하거나 Word/DOCX/PDF/Markdown/채팅 본문으로 우회하지 마. 사본 URL 확보 전에는 완성형 답변서를 채팅에 쓰지 마. 계약표는 계약기간과 이용상품만 기본 사용하고 결제 상세 원문을 그대로 전사해. 내부 CS 용어, 불필요한 보증금·금액 세부·미확인 상태·방어 문장을 제거해. 편집 전후 SpaceV 로고, 29pt 중앙 Bold 제목, 447pt 수신인 표, 91.5pt/362.25pt 계약표, 하단 가로선·발신부가 유지되는지 검증하고 최종에는 검증된 docs.google.com/document 링크만 제공해.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  allow_implicit_invocation: true
