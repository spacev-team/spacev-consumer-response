interface:
  display_name: 삼삼엠투 소비자원 답변서
  short_description: 소보원·1372 민원을 SpaceV 고정 Google Docs 양식으로 바로 작성
  default_prompt: >-
    공문, 결제 상세 정보, 계약메모 전체를 검토해 소비자원 답변서를 작성해줘. 반드시 고정 Google Docs 템플릿 문서 ID 1m3rgfQz_GqcyuijmqmRHKQq_PZKqER4II7A5PylHIqM를 직접 열고 네이티브 복사한 뒤 복사본만 편집해. Drive에서 템플릿을 검색하거나 다른 답변서를 고르지 마. 복제본 URL을 얻기 전에는 답변서 본문을 채팅에 쓰지 마. 채팅 초안, Markdown 답변서, Word/DOCX/PDF 생성은 금지하고 Google Docs copy/edit가 불가능하면 다른 형식으로 우회하지 말고 중단해. 1. 계약 내용은 기본적으로 계약기간과 이용상품만 넣고 결제 상세 원문을 그대로 사용해. CS 지원금/CS 보상은 쓰지 말고 회사 보상은 이용 수수료를 현금으로 보상한 사실로 자연스럽게 풀어 써. 보증금·총 결제금액·세부 이용대금·실제 퇴실일은 꼭 필요하고 사용자 동의가 있는 경우가 아니면 넣지 마. 회신일 현재, 불필요한 확인되지 않았습니다, 당사가 보관하고 있지 않습니다, 임의로 회수, 전액 반환을 확정할 수 없습니다 같은 불필요하게 방어적인 문장은 삭제해. 같은 사실은 한 번만 쓰고 한 문단은 1~2문장으로 작성해. 최종 채팅에는 검증된 docs.google.com/document 링크만 제공해. First verify a callable native Drive file-copy action. Never direct-create or imitate the template. After native copy, verify the positioned SpaceV logo, centered 29pt bold title, fixed-width recipient table, 91.5pt/362.25pt contract columns, and footer rule. If any check fails, stop and return no document link.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  allow_implicit_invocation: true
